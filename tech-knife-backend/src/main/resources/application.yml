server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  servlet:
    context-path: /


spring:
  main:
    allow-bean-definition-overriding: false
  application:
    name: tech-knife-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://techknife01_db_user:cgTVT9DFas3hoG3n@techknife.yotus1r.mongodb.net/techknife?retryWrites=true&w=majority&appName=TechKnife}
      database: ${MONGODB_DATABASE:techknife}

      auto-index-creation: true
      min-pool-size: ${MONGODB_MIN_POOL_SIZE:10}
      max-pool-size: ${MONGODB_MAX_POOL_SIZE:100}
      max-idle-time-ms: ${MONGODB_MAX_IDLE_TIME_MS:600000}
      connect-timeout-ms: ${MONGODB_CONNECT_TIMEOUT_MS:10000}
      socket-timeout-ms: ${MONGODB_SOCKET_TIMEOUT_MS:30000}
      server-selection-timeout-ms: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:30000}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:noreply@techknife.com}
    password: ${SMTP_PASSWORD:secret_password}
    protocol: ${SMTP_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_TLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

client:
  url: ${CLIENT_URL:http://localhost:5173,http://localhost:3000}

app:
  mail:
    from: ${MAIL_FROM:noreply@techknife.com}
    from-name: ${MAIL_FROM_NAME:Tech Knife Enterprise}

  jwt:
    secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    refresh-secret: ${JWT_REFRESH_SECRET:8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
    issuer: tech-knife-enterprise

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:tech-knife-cloud}
    api-key: ${CLOUDINARY_API_KEY:123456789012345}
    api-secret: ${CLOUDINARY_API_SECRET:cloudinary_secret_key_here}

  github:
    client-id: ${GITHUB_CLIENT_ID:github_client_id_here}
    client-secret: ${GITHUB_CLIENT_SECRET:github_client_secret_here}
    organization: ${GITHUB_ORG:tech-knife-org}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://techknife.app}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
    doc-expansion: none
    show-extensions: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans,caches,env,mappings,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    defaults:
      enabled: true
    mongo:
      enabled: true
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      http: true
      mongo: true
      disk: true
      cpu: true
      memory: true
      thread: true
    export:
      prometheus:
        enabled: true

logging:
  request:
    enabled: true
    slow-threshold-ms: 1000
    include-query-params: true
    include-response-size: true
  level:
    root: INFO
    com.techknife: INFO
    org.springframework.security: TRACE
    org.springframework.security.web.FilterChainProxy: TRACE
    org.springframework.security.web.access: TRACE
    org.springframework.security.web.authentication: TRACE
    org.springframework.web.socket: TRACE
    org.springframework.data.mongodb: INFO
    org.springframework.data.mongodb.core.MongoTemplate: INFO
    org.mongodb.driver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Development Environment Profile
server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/techknife}
      database: ${MONGODB_DATABASE:techknife}

      auto-index-creation: true
      min-pool-size: 5
      max-pool-size: 50
      max-idle-time-ms: 600000
      connect-timeout-ms: 10000
      socket-timeout-ms: 30000
      server-selection-timeout-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.techknife: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.data.mongodb.core.MongoTemplate: INFO
    org.mongodb.driver: INFO

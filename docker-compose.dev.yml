version: '3.8'

services:
  # Tech Knife Local MongoDB Container (Development Only)
  mongodb:
    image: mongo:7.0-jammy
    container_name: techknife-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev_user
      MONGO_INITDB_ROOT_PASSWORD: dev_password_2026
      MONGO_INITDB_DATABASE: techknife_dev
    volumes:
      - mongo_data_dev:/data/db

  # Tech Knife Local Redis Container (Caching & Queue - Optional)
  redis:
    image: redis:7-alpine
    container_name: techknife-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_pass_2026
    volumes:
      - redis_data_dev:/data

  # Tech Knife Backend Service (Node.js + Express)
  backend:
    build:
      context: ./tech-knife-backend
      dockerfile: Dockerfile
    container_name: techknife-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://dev_user:dev_password_2026@mongodb:27017/techknife_dev?authSource=admin
      REDIS_URL: redis://:dev_redis_pass_2026@redis:6379
      JWT_SECRET: dev_jwt_secret_techknife_2026
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_techknife_2026
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis

  # Tech Knife Frontend Service (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techknife-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_APP_NAME: "Tech Knife (Dev)"
      VITE_ENVIRONMENT: development
    depends_on:
      - backend

volumes:
  mongo_data_dev:
  redis_data_dev:

version: '3.8'

services:
  # Nginx Reverse Proxy for Frontend & SSL Termination
  nginx:
    image: nginx:alpine
    container_name: techknife-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  # Tech Knife Frontend Production Container
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techknife-frontend-prod
    restart: always
    environment:
      VITE_API_URL: https://api.techknife.com/v1
      VITE_APP_NAME: "Tech Knife"
      VITE_ENVIRONMENT: production

  # Tech Knife Backend Production Container
  backend:
    build:
      context: ./tech-knife-backend
      dockerfile: Dockerfile
    container_name: techknife-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: https://www.techknife.com
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
